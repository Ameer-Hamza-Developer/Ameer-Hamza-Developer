<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Ameer Hamza, Senior React Native Engineer">
  <defs>
    <radialGradient id="g1" cx="80%" cy="0%" r="55%"><stop offset="0" stop-color="#4f8cff" stop-opacity="0.30"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="8%" cy="0%" r="45%"><stop offset="0" stop-color="#4f8cff" stop-opacity="0.16"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.7"/></filter>
    <clipPath id="card"><rect x="700" y="48" width="524" height="244" rx="16"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .k { fill: #4f8cff; } .v { fill: #f5f5f7; font-weight: 700; } .a { fill: #c9d1d9; } .s { fill: #9ecbff; } .p { fill: #6e7681; }
      .glow { animation: pulse 6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
      .fade { animation: rise 0.9s ease-out backwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .line { animation: type 12s ease-out infinite backwards; }
      @keyframes type { 0% { opacity: 0; transform: translateX(-10px); } 5% { opacity: 1; transform: translateX(0); } 82% { opacity: 1; } 88%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .dot { animation: ping 2s ease-out infinite; transform-origin: 1118px 69px; }
      @keyframes ping { 0% { opacity: 0.7; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.6); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="340" fill="#0a0a0b"/>
  <rect class="glow" width="1280" height="340" fill="url(#g1)"/>
  <rect width="1280" height="340" fill="url(#g2)"/>

  <!-- Left: name and title -->
  <g class="sans">
    <rect class="fade" x="64" y="88" width="40" height="3" fill="#4f8cff"/>
    <text class="fade" x="64" y="124" font-size="14" font-weight="600" letter-spacing="2.4" fill="#4f8cff" style="animation-delay:.1s">SENIOR REACT NATIVE ENGINEER</text>
    <text class="fade" x="62" y="188" font-size="58" font-weight="700" letter-spacing="-1.6" fill="#f5f5f7" style="animation-delay:.25s">Ameer Hamza</text>
    <text class="fade" x="64" y="232" font-size="21" fill="#a1a1a8" style="animation-delay:.45s">I build <tspan fill="#f5f5f7" font-weight="600">fast, reliable iOS &amp; Android apps</tspan></text>
    <text class="fade" x="64" y="262" font-size="21" fill="#a1a1a8" style="animation-delay:.55s">from empty repo to the App Store.</text>
  </g>

  <!-- Right: code window -->
  <g filter="url(#shadow)"><rect x="700" y="48" width="524" height="244" rx="16" fill="#111113"/></g>
  <g clip-path="url(#card)">
    <rect x="700" y="48" width="524" height="42" fill="#141417"/>
    <line x1="700" y1="90" x2="1224" y2="90" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>
  <rect x="700.5" y="48.5" width="523" height="243" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="724" cy="69" r="5.5" fill="#ff5f57"/><circle cx="743" cy="69" r="5.5" fill="#febc2e"/><circle cx="762" cy="69" r="5.5" fill="#28c840"/>
  <text class="mono" x="784" y="74" font-size="13" fill="#8e8e93">developer.ts</text>

  <g class="mono">
    <text class="line" x="722" y="124" style="animation-delay:.6s"><tspan class="k">const</tspan> <tspan class="v">developer</tspan> <tspan class="p">= {</tspan></text>
    <text class="line" x="740" y="148" style="animation-delay:1.0s"><tspan class="a">stack</tspan><tspan class="p">: [</tspan><tspan class="s">"React Native"</tspan><tspan class="p">, </tspan><tspan class="s">"TypeScript"</tspan><tspan class="p">, </tspan><tspan class="s">"Expo"</tspan><tspan class="p">],</tspan></text>
    <text class="line" x="740" y="172" style="animation-delay:1.4s"><tspan class="a">platforms</tspan><tspan class="p">: [</tspan><tspan class="s">"iOS"</tspan><tspan class="p">, </tspan><tspan class="s">"Android"</tspan><tspan class="p">],</tspan></text>
    <text class="line" x="740" y="196" style="animation-delay:1.8s"><tspan class="a">experience</tspan><tspan class="p">: </tspan><tspan class="s">"4+ years"</tspan><tspan class="p">,</tspan></text>
    <text class="line" x="740" y="220" style="animation-delay:2.2s"><tspan class="a">appsShipped</tspan><tspan class="p">: </tspan><tspan class="k">5</tspan><tspan class="p">,</tspan></text>
    <text class="line" x="740" y="244" style="animation-delay:2.6s"><tspan class="a">openToWork</tspan><tspan class="p">: </tspan><tspan class="k">true</tspan><tspan class="p">,</tspan></text>
    <g class="line" style="animation-delay:3.0s">
      <text x="722" y="268" class="p">};</text>
      <rect class="cursor" x="746" y="254" width="9" height="17" fill="#4f8cff"/>
    </g>
  </g>

  <!-- live "available" signal in the title bar -->
  <g class="sans">
    <circle class="dot" cx="1118" cy="69" r="4.5" fill="#34d399"/>
    <circle cx="1118" cy="69" r="4.5" fill="#34d399"/>
    <text x="1130" y="74" font-size="13" fill="#8e8e93">available</text>
  </g>
</svg>
